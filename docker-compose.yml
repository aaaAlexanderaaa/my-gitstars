services:
  app:
    # `build` was commented out while `image` was pinned, so `docker compose up --build`
    # silently built nothing and then failed on a missing local image. With both set,
    # Compose builds when asked and reuses the tag otherwise.
    build:
      context: .
      dockerfile: Dockerfile
    image: my-gitstars:latest
    ports:
      - "${APP_PORT:-4000}:${PORT:-4000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
        required: false
    restart: unless-stopped
    env_file:
      # Everything in .env reaches the container, so adding a new setting no longer
      # means remembering to list it here as well.
      - path: .env
        required: false
    environment:
      # Container-local defaults. Compose also reads ./.env for interpolation, so a
      # value set there wins over these fallbacks.
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-4000}
      - APP_URL=${APP_URL:-http://localhost:4000}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-gitstars}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      # Bare names = pass through only when set in the calling shell. Writing
      # `FOO=${FOO:-}` instead would inject an empty value that overrides env_file,
      # so credentials supplied via .env would be silently blanked.
      - GITHUB_CLIENT_ID
      - GITHUB_CLIENT_SECRET
      - SESSION_SECRET
      - GITHUB_OAUTH_SCOPE
      - COOKIE_SECURE
      - CORS_ORIGINS
      - HTTP_PROXY
      - HTTPS_PROXY
      - http_proxy
      - https_proxy
      # Scheduler and timing knobs, so every variable documented in .env.example
      # works whether it is set in .env or exported in the calling shell.
      - SYNC_TICK_INTERVAL_MS
      - VERSION_TRACKING_TICK_INTERVAL_MS
      - VERSION_TRACKING_TAG
      - SYNC_FAILURE_BACKOFF_MS
      - SYNC_AUTH_FAILURE_BACKOFF_MS
      - SCHEDULER_STARTUP_DELAY_MS
      - SYNC_STALE_AFTER_MS
      - DB_WAIT_TIMEOUT_MS
      - DB_WAIT_RETRY_MS
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:'+(process.env.PORT||4000)+'/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  db:
    image: postgres:16-alpine
    profiles:
      - local-db
    ports:
      - "127.0.0.1:${DB_PUBLISH_PORT:-25432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-gitstars}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gitstars}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
